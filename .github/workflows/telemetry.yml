name: Live Telemetry Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Podcast
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://media.rss.com/void-dynamics-model/feed.xml"
          comment_tag_name: "PODCAST"
          max_post_count: 3

      - name: Inject Zenodo (via REST API — stable & robust)
        run: |
          # 1. Fetch the latest 3 records (public API — no token needed)
          curl -s "https://zenodo.org/api/records/?communities=void-dynamics-model&size=3&sort=newest" -o zenodo.json

          # 2. Build the exact markdown block your README expects
          {
            echo '<h4 style="margin-top: 0; color: #3FB950;">📄 Zenodo</h4>'
            jq -r '.hits.hits[] | "- [" + .metadata.title + "](" + .links.html + ") (" + (.metadata.publication_date // .created | split("T")[0]) + ")"' zenodo.json
          } > zenodo_section.md

          # 3. Replace the tagged section (awk is rock-solid for this)
          awk '
            /<!-- ZENODO:START -->/ {
              print
              while ((getline line < "zenodo_section.md") > 0) print line
              close("zenodo_section.md")
              while (getline && $0 !~ /<!-- ZENODO:END -->/) next
              print "<!-- ZENODO:END -->"
              next
            }
            { print }
          ' README.md > README.tmp && mv README.tmp README.md

          echo "✅ Zenodo section updated with latest 3 records"
          rm -f zenodo.json zenodo_section.md
        shell: bash

      - name: Inject Medium
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@jlietz93"
          comment_tag_name: "MEDIUM"
          max_post_count: 3

      - name: Inject YouTube
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=PLZ7ANL9K2fXJjPnISBbvCaJcBSscIYTQk"
          comment_tag_name: "YOUTUBE"
          max_post_count: 3
