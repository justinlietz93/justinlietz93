# File: .github/workflows/telemetry.yml
name: Live Telemetry Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Podcast
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://media.rss.com/void-dynamics-model/feed.xml"
          comment_tag_name: "PODCAST"
          max_post_count: 3

      - name: Inject Zenodo
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://zenodo.org/communities/void-dynamics-model/records/?format=rss"
          comment_tag_name: "ZENODO"
          max_post_count: 3

      - name: Inject Medium
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@jlietz93"
          comment_tag_name: "MEDIUM"
          max_post_count: 3

      - name: Inject YouTube
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=PLZ7ANL9K2fXJjPnISBbvCaJcBSscIYTQk"
          comment_tag_name: "YOUTUBE"
          max_post_count: 3
